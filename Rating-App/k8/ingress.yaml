apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  namespace: my-ns
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: front-svc
            port:
              number: 80
#removed  - host: myapp.local because iam using kodecloud and it does not have access to localhost,myapp.local,chng ingress
#chng ingressClassname to treakfix because the ingress controller we have in kodekl is traefix 
#kubectl get svc -n ingress-traefix -n my-ns and other kubectl get svc -A | grep -i traefik check ip 
# 80:31234/TCP,443:32456/TCP  5-digit port number mapped to port 80 (for example, 31234
