apiVersion: apps/v1
kind: Deployment
metadata: 
  name: web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myweb-app
  template:
    metadata:
      labels:
        app: myweb-app
    spec:
     containers:
     - name: nginx
       image: nginx:alpine
       ports:
       - containerPort: 80
  # resourec aand limits added
       resources:
         requests:
           cpu: "100m"
           memory: "64Mi"
         limits:
           cpu: "250m"
           memory: "100Mi"
       readinessProbe:
         httpGet:
           path: /
           port: 80
         initialDelaySeconds: 3
         periodSeconds: 5
       livenessProbe:
         httpGet:
           path: /
           port: 80
         initialDelaySeconds: 10
         periodSeconds: 5
         failureThreshold: 3
         
