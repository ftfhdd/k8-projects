apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: my-app
      track: stable
  template:
    metadata:
      labels:
        app: my-app # Shared label used by the Service
        track: stable
    spec:
      containers:
        - name: app
          image: my-app:1.0