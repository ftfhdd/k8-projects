apiVersion: apps/v1
kind: Deployment 
metadata:
  name: backend-deployment
  namespace: my-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: satyasowmyagudela/raing-back:v1
        ports:
        - containerPort: 5000
        envFrom:
         - configMapRef:
             name: my-config
         - secretRef:
             name: my-secret
