apiVersion: apps/v1
kind: Deployment
metadata: 
  name: front-depl
  namespace: my-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: satyasowmyagudela/rating-frontend:latest
        ports:
        - containerPort: 80