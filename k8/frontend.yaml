kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  namespace: mynamespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: satyasowmyagudela/backend-image:latest
          ports:
            - containerPort: 80