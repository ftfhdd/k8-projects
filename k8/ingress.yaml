apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  namespace: my-ns
  annotations:
   kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: myapp.local
    http:
      paths:
      - path: /
        pathType: prefix
        backend:
          service:
            name: front-svc
            port:
              number: 80
      - path: /api
        pathType: prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000

