apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: mynamespace
  labels:
    app: mongodbl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodbl
  template:
    metadata:
      labels:
        app: mongodbl
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongo-pvc
