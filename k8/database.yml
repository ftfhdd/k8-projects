apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: mynamespace
  labels:
    app: mongodbl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodbl
  template:
    metadata:
      labels:
        app: mongodbl
    spec:
      containers:
      - name: mongodb
        image: mongo
        ports:
        - containerPort: 27017